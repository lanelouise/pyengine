[project]
name = "pyengine"
version = "0.1.0"
description = "3D game engine in Python built on Panda3D, with node-tree scenes, 2D physics, events, and hot reload."
readme = "README.md"
authors = [
    { name = "Lane Louise", email = "lane@ignitiva.com.br" }
]
requires-python = ">=3.10"
dependencies = [
    "panda3d>=1.10.16",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "types-panda3d>=0.4.1",
]

[tool.uv]
package = false
